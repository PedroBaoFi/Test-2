<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a1f">
<title>OrbitFit – Health Monitoring for Astronauts (and the rest of us)</title>
<meta name="description" content="A gamified health monitor for astronauts on Earth orbit, the Moon, Mars and deep space — adapted to life on Earth. NASA Space Apps 2026.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="view"></main>
  <nav id="nav">
    <button data-act="tab" data-id="path"><span>🏠</span><small>Path</small></button>
    <button data-act="tab" data-id="body"><span>🧍</span><small>Body</small></button>
    <button data-act="tab" data-id="health"><span>❤️</span><small>Health</small></button>
    <button data-act="tab" data-id="sos"><span>🆘</span><small>SOS</small></button>
    <button data-act="tab" data-id="rad"><span>☢️</span><small>Radiation</small></button>
  </nav>
</div>
<div id="sheet" class="hidden">
  <div class="backdrop" data-act="close"></div>
  <div class="panel"><button class="x" data-act="close" aria-label="Close">✕</button><div id="sheetBody"></div></div>
</div>
<div id="toast"></div>
<script src="data/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
